<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Abdul Sattar - AI, Full-Stack and Mobile Developer">
  <title>Abdul Sattar &#8212; AI &#183; Full-Stack &#183; Mobile Developer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0B1017"/>
      <stop offset="55%"  stop-color="#0D131C"/>
      <stop offset="100%" stop-color="#0A1620"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#818CF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22D3EE"/>
      <stop offset="60%"  stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#22D3EE"/>
      <stop offset="65%"  stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#7DD3FC" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card"><rect width="1200" height="330" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#grid)"/>
    <ellipse cx="150"  cy="40"  rx="420" ry="260" fill="url(#glowA)"/>
    <ellipse cx="1060" cy="300" rx="400" ry="250" fill="url(#glowB)"/>

    <!-- top accent rule, draws in once -->
    <rect x="0" y="0" width="0" height="2" fill="url(#topline)">
      <animate attributeName="width" from="0" to="1200" dur="1.1s" begin="0s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
    </rect>

    <!-- ================= LEFT : identity ================= -->
    <text x="64" y="76" font-size="12.5" letter-spacing="3.6" fill="#22D3EE" opacity="0"
          font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace">
      <animate attributeName="opacity" from="0" to="0.95" begin="0.25s" dur="0.5s" fill="freeze"/>
      SOFTWARE&#160;&#160;ENGINEER
    </text>

    <g font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', sans-serif">
      <text x="63" y="146" font-size="58" font-weight="700" letter-spacing="-0.5" fill="#E9EFF6" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.7s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0"
                          begin="0.45s" dur="0.7s" fill="freeze" calcMode="spline"
                          keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
        Abdul Sattar
      </text>

      <rect x="64" y="166" width="0" height="3" rx="1.5" fill="url(#rule)">
        <animate attributeName="width" from="0" to="230" dur="0.8s" begin="0.85s" fill="freeze"
                 calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
      </rect>

      <text x="64" y="208" font-size="19.5" font-weight="600" letter-spacing="1.4" fill="#7DD3FC" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.6s" fill="freeze"/>
        AI&#160;&#160;&#183;&#160;&#160;Full-Stack&#160;&#160;&#183;&#160;&#160;Mobile
      </text>

      <text x="64" y="243" font-size="15.5" fill="#93A4B8" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.6s" fill="freeze"/>
        I build AI-powered products end to end &#8212; from the model to the shipped app.
      </text>
    </g>

    <!-- stack chips -->
    <g font-size="11.5" opacity="0"
       font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace">
      <animate attributeName="opacity" from="0" to="1" begin="1.55s" dur="0.6s" fill="freeze"/>
      <rect x="64"  y="268" width="118" height="28" rx="14" fill="#0F1E2B" stroke="#1E3A4C"/>
      <text x="123" y="286" text-anchor="middle" fill="#8FB3C7">TypeScript</text>

      <rect x="192" y="268" width="100" height="28" rx="14" fill="#0F1E2B" stroke="#1E3A4C"/>
      <text x="242" y="286" text-anchor="middle" fill="#8FB3C7">Next.js</text>

      <rect x="302" y="268" width="96"  height="28" rx="14" fill="#0F1E2B" stroke="#1E3A4C"/>
      <text x="350" y="286" text-anchor="middle" fill="#8FB3C7">Python</text>

      <rect x="408" y="268" width="94"  height="28" rx="14" fill="#0F1E2B" stroke="#1E3A4C"/>
      <text x="455" y="286" text-anchor="middle" fill="#8FB3C7">Flutter</text>

      <rect x="512" y="268" width="146" height="28" rx="14" fill="#0F1E2B" stroke="#1E3A4C"/>
      <text x="585" y="286" text-anchor="middle" fill="#8FB3C7">TensorFlow Lite</text>
    </g>

    <!-- ============ RIGHT : idea -> system -> product ============ -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.8s" fill="freeze"/>

      <line x1="884"  y1="150" x2="962"  y2="150" stroke="#1E3A4C" stroke-width="2"/>
      <line x1="1022" y1="150" x2="1100" y2="150" stroke="#1E3A4C" stroke-width="2"/>

      <!-- node 1 : idea -->
      <rect x="828" y="122" width="56" height="56" rx="15" fill="#0E1B26" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle cx="856" cy="148" r="9" fill="none" stroke="#22D3EE" stroke-width="1.8"/>
      <line x1="856" y1="159" x2="856" y2="164" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round"/>

      <!-- node 2 : system -->
      <rect x="962" y="122" width="60" height="56" rx="15" fill="#0E1B26" stroke="#818CF8" stroke-opacity="0.55" stroke-width="1.5"/>
      <rect x="982" y="136" width="22" height="9" rx="2.5" fill="none" stroke="#818CF8" stroke-width="1.7"/>
      <rect x="982" y="151" width="22" height="9" rx="2.5" fill="none" stroke="#818CF8" stroke-width="1.7"/>
      <circle cx="977" cy="140.5" r="1.7" fill="#818CF8"/>
      <circle cx="977" cy="155.5" r="1.7" fill="#818CF8"/>

      <!-- node 3 : product -->
      <rect x="1100" y="122" width="56" height="56" rx="15" fill="#0E1B26" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.5"/>
      <path d="M1118 151 l6 6 l13 -14" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- travelling pulse -->
      <circle cy="150" r="3.5" fill="#22D3EE" filter="url(#soft)">
        <animate attributeName="cx" values="890;956;1028;1094" keyTimes="0;0.42;0.58;1"
                 dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.08;0.5;0.9;1"
                 dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#22D3EE;#22D3EE;#818CF8;#34D399" keyTimes="0;0.4;0.6;1"
                 dur="3.4s" repeatCount="indefinite"/>
      </circle>

      <g font-size="10.5" letter-spacing="2.2" fill="#6B8296" text-anchor="middle"
         font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace">
        <text x="856"  y="202">IDEA</text>
        <text x="992"  y="202">SYSTEM</text>
        <text x="1128" y="202">PRODUCT</text>
      </g>
    </g>

    <rect x="0" y="328" width="1200" height="2" fill="#22D3EE" opacity="0.12"/>
  </g>
</svg>
