<svg xmlns="http://www.w3.org/2000/svg" width="920" height="252" viewBox="0 0 920 252" role="img" aria-label="Stack by layer: interface, logic, intelligence, data">
  <title>The stack, by layer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1017"/><stop offset="55%" stop-color="#0D131C"/><stop offset="100%" stop-color="#0A1620"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.20"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.18"/><stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/><stop offset="60%" stop-color="#818CF8"/><stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/><stop offset="22%" stop-color="#22D3EE"/>
      <stop offset="62%" stop-color="#818CF8"/><stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7DD3FC" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="920" height="252" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="920" height="252" fill="url(#bg)"/>
    <rect width="920" height="252" fill="url(#grid)"/>
    <ellipse cx="90" cy="0" rx="360" ry="210" fill="url(#glowA)"/>
    <ellipse cx="830" cy="252" rx="360" ry="210" fill="url(#glowB)"/>
    <rect x="0" y="0" width="920" height="2" fill="url(#topline)"></rect>
    <g opacity="1">
      <rect x="32" y="16" width="856" height="46" rx="11" fill="#0E1620" stroke="#1B2B3A"/>
      <rect x="32" y="16" width="4" height="46" rx="2" fill="#22D3EE"><animate attributeName="opacity" values="0.45;1;0.45" dur="3.6s" begin="0.0s" repeatCount="indefinite"/></rect>
      <text x="58" y="44" font-size="11" letter-spacing="2.2" font-weight="600" fill="#22D3EE" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace">INTERFACE</text>
      <text x="210" y="44" font-size="14" fill="#A9BBCB" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', sans-serif">Next.js  ·  React  ·  Flutter  ·  Tailwind CSS  ·  Framer Motion  ·  Three.js</text>
    </g>
    <g opacity="1">
      <rect x="32" y="72" width="856" height="46" rx="11" fill="#0E1620" stroke="#1B2B3A"/>
      <rect x="32" y="72" width="4" height="46" rx="2" fill="#818CF8"><animate attributeName="opacity" values="0.45;1;0.45" dur="3.6s" begin="0.9s" repeatCount="indefinite"/></rect>
      <text x="58" y="100" font-size="11" letter-spacing="2.2" font-weight="600" fill="#818CF8" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace">LOGIC</text>
      <text x="210" y="100" font-size="14" fill="#A9BBCB" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', sans-serif">Node.js  ·  API Routes  ·  NextAuth  ·  Zod  ·  Stripe  ·  Nodemailer</text>
    </g>
    <g opacity="1">
      <rect x="32" y="128" width="856" height="46" rx="11" fill="#0E1620" stroke="#1B2B3A"/>
      <rect x="32" y="128" width="4" height="46" rx="2" fill="#C084FC"><animate attributeName="opacity" values="0.45;1;0.45" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></rect>
      <text x="58" y="156" font-size="11" letter-spacing="2.2" font-weight="600" fill="#C084FC" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace">INTELLIGENCE</text>
      <text x="210" y="156" font-size="14" fill="#A9BBCB" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', sans-serif">Claude  ·  Gemini  ·  OpenAI  ·  TensorFlow Lite  ·  CNN  ·  Kokoro TTS</text>
    </g>
    <g opacity="1">
      <rect x="32" y="184" width="856" height="46" rx="11" fill="#0E1620" stroke="#1B2B3A"/>
      <rect x="32" y="184" width="4" height="46" rx="2" fill="#34D399"><animate attributeName="opacity" values="0.45;1;0.45" dur="3.6s" begin="2.7s" repeatCount="indefinite"/></rect>
      <text x="58" y="212" font-size="11" letter-spacing="2.2" font-weight="600" fill="#34D399" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace">DATA</text>
      <text x="210" y="212" font-size="14" fill="#A9BBCB" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', sans-serif">Prisma  ·  PostgreSQL  ·  SQLite</text>
    </g>
  </g>
</svg>
